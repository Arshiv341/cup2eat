<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="bgChoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2A1B14"/>
      <stop offset="100%" stopColor="#1A110D"/>
    </linearGradient>
    <linearGradient id="cupChoc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#4A2F21"/>
      <stop offset="35%" stopColor="#6E4733"/>
      <stop offset="70%" stopColor="#553626"/>
      <stop offset="100%" stopColor="#3B2519"/>
    </linearGradient>
    <linearGradient id="innerChoc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#2F1B12"/>
      <stop offset="100%" stopColor="#4F3021"/>
    </linearGradient>
    <pattern id="waffleGrid" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="none"/>
      <path d="M 0 0 L 20 0 M 0 0 L 0 20" stroke="#3A2216" stroke-width="1.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="500" height="500" rx="24" fill="#F4EFEA"/>
  
  <!-- Subtle warm pedestal shadow -->
  <ellipse cx="250" cy="425" rx="130" ry="24" fill="#E2D7CC"/>
  <ellipse cx="250" cy="425" rx="95" ry="16" fill="#CEBEB0"/>

  <!-- Tapered Edible Cup Body (Wider top, biscuit angled sides) -->
  <path d="M 140 160 L 175 390 C 180 410 205 418 250 418 C 295 418 320 410 325 390 L 360 160 Z" fill="url(#cupChoc)"/>
  
  <!-- Waffle texture overlay -->
  <path d="M 140 160 L 175 390 C 180 410 205 418 250 418 C 295 418 320 410 325 390 L 360 160 Z" fill="url(#waffleGrid)"/>

  <!-- Inner Cup Rim -->
  <ellipse cx="250" cy="160" rx="110" ry="28" fill="url(#innerChoc)" stroke="#5A3A29" stroke-width="3"/>
  <ellipse cx="250" cy="164" rx="100" ry="22" fill="#20110A"/>

  <!-- Steaming Tea / Hot Beverage Surface -->
  <ellipse cx="250" cy="170" rx="88" ry="16" fill="#5C2E17" opacity="0.9"/>

  <!-- Biscuit Edge Highlights -->
  <path d="M 142 165 C 160 380 185 415 250 415" stroke="#875840" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 250 132 C 250 132 258 115 250 100 C 242 85 255 70 250 55" stroke="#A78B71" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 230 135 C 230 135 238 120 232 108 C 226 95 235 82 230 70" stroke="#A78B71" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Flavour Badge -->
  <rect x="35" y="35" width="160" height="34" rx="17" fill="#1B382B"/>
  <text x="115" y="57" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#D4AF37" text-anchor="middle" letter-spacing="1">CHOCOLATE 100ML</text>
  <text x="250" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#6B5344" text-anchor="middle" letter-spacing="0.5">100% Baked Edible Biscuit Wafer</text>
</svg>
