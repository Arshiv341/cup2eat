<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="cupElai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#7B8C66"/>
      <stop offset="35%" stopColor="#9CAB82"/>
      <stop offset="70%" stopColor="#8A9D72"/>
      <stop offset="100%" stopColor="#677854"/>
    </linearGradient>
    <linearGradient id="innerElai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#4F5D3E"/>
      <stop offset="100%" stopColor="#768761"/>
    </linearGradient>
    <pattern id="waffleGridElai" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="none"/>
      <path d="M 0 0 L 20 0 M 0 0 L 0 20" stroke="#576846" stroke-width="1.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="500" height="500" rx="24" fill="#F4F6F2"/>
  
  <ellipse cx="250" cy="425" rx="130" ry="24" fill="#E2E7DD"/>
  <ellipse cx="250" cy="425" rx="95" ry="16" fill="#C9D3C2"/>

  <!-- Tapered Edible Cup Body -->
  <path d="M 140 160 L 175 390 C 180 410 205 418 250 418 C 295 418 320 410 325 390 L 360 160 Z" fill="url(#cupElai)"/>
  <path d="M 140 160 L 175 390 C 180 410 205 418 250 418 C 295 418 320 410 325 390 L 360 160 Z" fill="url(#waffleGridElai)"/>

  <!-- Rim -->
  <ellipse cx="250" cy="160" rx="110" ry="28" fill="url(#innerElai)" stroke="#7B8C66" stroke-width="3"/>
  <ellipse cx="250" cy="164" rx="100" ry="22" fill="#36402A"/>

  <!-- Steaming Masala Chai Surface -->
  <ellipse cx="250" cy="170" rx="88" ry="16" fill="#8A5A36" opacity="0.95"/>

  <!-- Steam -->
  <path d="M 250 132 C 250 132 258 115 250 100 C 242 85 255 70 250 55" stroke="#7B8C66" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M 230 135 C 230 135 238 120 232 108 C 226 95 235 82 230 70" stroke="#7B8C66" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Flavour Badge -->
  <rect x="35" y="35" width="165" height="34" rx="17" fill="#1B382B"/>
  <text x="117" y="57" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#D4AF37" text-anchor="middle" letter-spacing="1">ELAICHI 100ML</text>
  <text x="250" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#5E6F4D" text-anchor="middle" letter-spacing="0.5">Aromatic Cardamom Spiced Wafer</text>
</svg>
